
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="Pixelmate - Image Processing Platform">
	<meta name="author" content="tomcvt">
	<title>Welcome</title>
	<link href="/css/main.css" rel="stylesheet" />
</head>
<body>
	<!-- Navbar -->
    <nav class="navbar">
        <ul class="navbar-list">
            <li class="navbar-item"><a href="/" class="navbar-link">Home</a></li>
            <li class="navbar-item"><a href="/about" class="navbar-link">About</a></li>
            <li class="navbar-item"><a href="/upload" class="navbar-link">Pixel Art</a></li>
            <li class="navbar-item dropdown">
                <a href="#" class="navbar-link">Other</a>
                <ul class="dropdown-menu">
					<li><a href="/tools/upload-tools" class="dropdown-link">Tools</a></li>
                    <li><a href="/tools/palette-picker" class="dropdown-link">Palette picker</a></li>
                </ul>
            </li>
        </ul>
    </nav>
    <script>import('/js/navbar.js').then(m => m.Navbar.init());</script>
    <!-- Navbar End -->
	<div class="content">
		<form class="login-form" style="max-width: 500px;">
			<h2>Welcome, <span th:text="${username}">User</span>!</h2>
			<div style="margin-bottom: 24px;">
				<p style="text-align: center; font-size: 1.1rem; color: var(--color-subheading);">
					Pixelmate is a simple tool for creating pixel art styled images from full sized images with dynamic parameter selection.
				</p>
			</div>
			<button type="button" class="btn btn-primary wide" onclick="window.location.href='/upload'">Upload Image</button>
		</form>
	</div>
</body>
</html>
